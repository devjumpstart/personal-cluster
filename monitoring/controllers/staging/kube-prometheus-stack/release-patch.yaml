apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  values:
    grafana:
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.olakunle.ca
  valuesFrom:
    - kind: Secret
      name: grafana-admin-password
      valuesKey: password
      targetPath: grafana.adminPassword