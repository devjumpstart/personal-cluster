apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudflared

  template:
    metadata:
      labels:
        app: cloudflared

    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared

          command:
            - cloudflared

          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run

          ports:
            - name: metrics
              containerPort: 2000

          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: cloudflared-config
              mountPath: /etc/cloudflared/config
              readOnly: true

            - name: cloudflared-credentials
              mountPath: /etc/cloudflared/credentials/credentials.json
              readOnly: true

      volumes:
        - name: cloudflared-config
          configMap:
            name: cloudflared-config

        - name: cloudflared-credentials
          secret:
            secretName: tunnel-credentials